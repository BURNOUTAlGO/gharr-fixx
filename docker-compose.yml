version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gharfix-db
    restart: always
    environment:
      MYSQL_DATABASE: gharfixdb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - gharfix-db-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: gharfix-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/gharfixdb?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: gharfix-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  gharfix-db-data:
